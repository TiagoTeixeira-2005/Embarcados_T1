# Configuracao da comunicacao UART/MODBUS (Entrega 02).
# Copie este arquivo para config.ini (na pasta onde o programa e executado)
# e ajuste os valores para a sua Raspberry Pi.

# Porta serial ligada a ESP32 (geralmente /dev/serial0 ou /dev/ttyS0).
uart_dispositivo=/dev/serial0

# 6 ULTIMOS digitos da matricula, sem espacos (obrigatorio).
# Escreva como texto: um '0' a esquerda e preservado.
# Exemplos deste grupo: 037656 ou 026581
matricula=037656

# Timeout de resposta (200 a 500 ms) e numero maximo de tentativas (1 a 3).
timeout_ms=300
max_tentativas=3

# Silencio de linha (ms) que marca o fim de uma trama quando o tamanho da
# resposta nao e conhecido (somente Parte 2).
silencio_ms=20

# Endereco do dispositivo didatico das Partes 1/2 (decimal ou 0x..).
endereco_modbus_didatico=0x01